name: Terraform Azure Deployment

# Trigger deployment when code is merged to main
# Manual execution is also available
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required permissions for Azure OIDC authentication
# No client secret is stored in GitHub
permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.5"
  TF_WORKING_DIR: .

jobs:

# ============================================================
# PLAN
# ============================================================
# Performs validation, security checks and creates Terraform plan
# No infrastructure changes are made in this stage
  terraform-plan:
    name: Terraform Validation and Plan
    runs-on: ubuntu-latest

    # GitHub Environment provides:
    # - secrets
    # - approval gates (if configured)
    # - deployment protection rules
    environment:
      name: lab

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    # Authenticate to Azure using OIDC federation
    # No Azure client secret is required
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # Initialize Terraform with Azure Storage backend
    # State is stored remotely and protected from local loss
    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
          -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE }}" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=github.tfstate" \
          -backend-config="use_azuread_auth=true"

      env:
        ARM_USE_OIDC: true
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    # Validate Terraform formatting
    - name: Terraform Format
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform fmt -check -recursive

    # Validate Terraform syntax and configuration
    - name: Terraform Validate
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform validate

    # Terraform code quality checks
    # Detects provider/resource best practice issues
    - name: TFLint
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |

        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
        tflint --init
        tflint


    # Infrastructure security scanning
    # Detects Azure security misconfigurations before deployment
    - name: Checkov
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |

        python3 -m pip install --upgrade pip
        python3 -m pip install checkov
        checkov \
          --directory . \
          --framework terraform


    # Generates execution plan
    # The output artifact is used by the Apply stage
    - name: Terraform Plan
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform plan -out=tfplan

      env:
        ARM_USE_OIDC: true
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # Pass plan file to Apply stage
    - name: Upload Terraform Plan
      uses: actions/upload-artifact@v4
      with:

        name: terraform-plan
        path: ${{ env.TF_WORKING_DIR }}/tfplan

# ============================================================
# APPLY
# ============================================================
# Deploys the approved Terraform plan into Azure
# Apply only runs after successful validation and plan
  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest

    # GitHub Environment approval happens here
    # Production approval gate
    # Configure reviewers in GitHub Environment settings
    environment:
      name: lab

    steps:
    - name: Checkout
      uses: actions/checkout@v4


    # Download the exact Terraform plan created previously
    # Prevents applying a different configuration than reviewed
    - name: Download Terraform Plan
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    # Authenticate again because each GitHub runner is temporary
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    # Reinitialize backend on new runner
    - name: Terraform Init
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform init \
          -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
          -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE }}" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=github.tfstate" \
          -backend-config="use_azuread_auth=true"

      env:
        ARM_USE_OIDC: true
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # Deploy approved Terraform plan
    - name: Terraform Apply
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: |
        terraform apply -auto-approve tfplan

      env:
        ARM_USE_OIDC: true
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
    # Display deployed resource outputs
    - name: Terraform Output
      working-directory: ${{ env.TF_WORKING_DIR }}

      run: terraform output

      env:
        ARM_USE_OIDC: true
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}